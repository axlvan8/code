function handleSingleClick(e) {
    const rect = canvas.getBoundingClientRect();
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
    if(startOpen){
        startProgram(true,x,y);
        return;
    }
    if(signingin){
        signin(true,x,y);
        return;
    }
    detectClickOnApp(x, y);
}

function handleDoubleClick(e) {
    const rect = canvas.getBoundingClientRect();
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;

    fileHitboxes.forEach(hit => {
        if (
            x >= hit.x &&
            x <= hit.x + hit.width &&
            y >= hit.y &&
            y <= hit.y + hit.height
        ) {
            const fullPath = hit.path + "/" + hit.name;
            const file = bus.getFile(fullPath);

            if (typeof file === "object") {
    // Folder → open explorer
    fileHitboxes = [];
    openFileExplorer(fullPath);
} else {
    // File → display it
    openedFilePath = fullPath;
    bus.displayFile(file);
}

        throw new Error("Invalid file path: " + path);
    }

    const encoder = new TextEncoder();
    const bytes = encoder.encode(file);

    for (let i = 0; i < bytes.length; i++) {
        this.write8(destAddr + i, bytes[i]);
    }

    this.write8(destAddr + bytes.length, 0); // null terminate

        this.rs1=0;
        this.rs2=0;

    handleEcall() {

        const a7 = this.regs[17];
        const a0 = this.regs[10];

        // putchar
        if (a7 === 1) {
            this.bus.write8(0x10000000, a0 & 0xff);
            return;
        }

        // getchar
        if (a7 === 3) {
            this.regs[10] = this.bus.read8(0x10000004);
            return;
        }

        throw new Error("Unknown syscall " + a7);
    }
    step() {

        const oldPC = this.pc;
        this.pc += 4;

        const opcode = instr & 0x7f;

        switch (opcode) {
            case 0x03: { // LOAD
                const rd = (instr >> 7) & 0x1f;
                const funct3 = (instr >> 12) & 0x7;
                const rs1 = (instr >> 15) & 0x1f;
                let imm = instr >> 20;
                imm = (imm << 20) >> 20;
                const addr = (this.regs[rs1] + imm) >>> 0;

                if (funct3 === 0x2) { // LW
                    this.regs[rd] = this.bus.read32(addr);
                } else {
                    throw new Error("Unsupported LOAD funct3 0x" + funct3.toString(16));
                }

                const rs1 = (instr >> 15) & 0x1f;
                const rs2 = (instr >> 20) & 0x1f;

                let imm = ((instr >> 7) & 0x1f) | (((instr >> 25) & 0x7f) << 5);
                imm = (imm << 20) >> 20;

                const addr = (this.regs[rs1] + imm) >>> 0;

                if (funct3 === 0x0) { // SB
                    this.bus.write8(addr, this.regs[rs2] & 0xff);
                } else if (funct3 === 0x2) { // SW
                    this.bus.write32(addr, this.regs[rs2]);
                } else {
                    throw new Error("Unsupported STORE funct3 0x" + funct3.toString(16));

            }

                    break;

                throw new Error("Unknown SYSTEM instruction");

                const rs1 = (instr >> 15) & 0x1f;
                let imm = instr >> 20;
                imm = (imm << 20) >> 20;
                this.regs[rd] = (this.regs[rs1] + imm) >>> 0;
                break;
            }

                const rs1 = (instr >> 15) & 0x1f;
                const rs2 = (instr >> 20) & 0x1f;

                let imm =
                    ((instr >> 31) << 12) |
                    (((instr >> 7) & 1) << 11) |
                    (((instr >> 25) & 0x3f) << 5) |
                    (((instr >> 8) & 0xf) << 1);

                imm = (imm << 19) >> 19;

                if (this.regs[rs1] === this.regs[rs2]) {
                    this.pc = (oldPC + imm) >>> 0;
                }
                break;
            }

           case 0x6f: { // JAL
                const rd = (instr >> 7) & 0x1f;

                let imm =
                    ((instr >> 31) << 20) |
                    (((instr >> 12) & 0xff) << 12) |
                    (((instr >> 20) & 1) << 11) |
                    (((instr >> 21) & 0x3ff) << 1);

                imm = (imm << 11) >> 11;

                this.regs[rd] = this.pc;
                this.pc = (oldPC + imm) >>> 0;

                const rd = (instr >> 7) & 0x1f;
                const rs1 = (instr >> 15) & 0x1f;

                imm = (imm << 20) >> 20;

                const target = (this.regs[rs1] + imm) >>> 0;

                this.regs[rd] = this.pc;

                break;
            }
            default:
                throw new Error("Unknown opcode 0x" + opcode.toString(16));
        }

        this.regs[0] = 0;
        return true;

function sleep(ms) {
  return new Promise(resolve => {
    const start = Date.now();
    function check() {
      if (Date.now() - start >= ms) {
        resolve();
      } else {
        requestAnimationFrame(check);
      }
    }
    check();
  });
}

   function openTextEditor(path) {

    ctx.clearRect(0,0,800,800);
    ctx.fillStyle = "white";
    ctx.fillRect(0,0,800,800);

    ctx.fillStyle = "black";
    ctx.font = "16px monospace";

    if (path) {
        const file = bus.getFile(path);

        if (typeof file === "string") {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(file);

            for (let i = 0; i < bytes.length; i++) {
                bus.write8(editorBufferAddr + i, bytes[i]);
            }

            bus.write8(editorBufferAddr + bytes.length, 0);
        }
    }

    renderEditor();
}
function renderEditor() {

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,800,800);

    ctx.fillStyle = "black";
    ctx.font = "16px monospace";
    
    let text = "";
    let addr = editorBufferAddr;
    let byte;

    while ((byte = bus.read8(addr++)) !== 0) {
        text += String.fromCharCode(byte);
    }

    const lines = text.split("\n");

    let y = 30;
    for (let line of lines) {
        ctx.fillText(line, 20, y);
        y += 20;
    }
}

function writeROM32(addr, value) {
    bus.rom[addr] = value & 0xff;
    bus.rom[addr + 1] = (value >> 8) & 0xff;
    bus.rom[addr + 2] = (value >> 16) & 0xff;
    bus.rom[addr + 3] = (value >> 24) & 0xff;
}

                        bus.files = {};
                        shellInput="All files deleted.";
                        shutDown();
                    }
                }else{
                    shellInput=`ERR: File not found: ${args[1]}`;
                }
            }
        }else{
            shellInput=`ERR: Missing filename`;
        }
    }
    else if(args[0] === "su" || args[0] === "switchuser"){
        shellIsOutputting=true;
        if(args[1]){
            for(var i=0;i<users.length;i++){
                if(users[i].name === args[1]){
                    user = users[i].name;
                    shellInput=`Switched to user: ${user}`;
                    return;
                }
            }
        }
        else{
            shellInput=`ERR: Unknown user: ${args[1]}`;
        }
    }
    else{
        shellIsOutputting=true;
        shellInput=`ERR: Unknown command: ${args[0]}`;
    }

}
function openShell(){
    ctx.clearRect(0,0,800,800);
    shellInput="";
    shellOpen=true;
    ctx.fillStyle='white';
    ctx.font='10px Arial';
    // print >
    writeROM32(0x00,0x03E00513); // a0='>'
    writeROM32(0x04,0x00100893); // a7=1
    writeROM32(0x08,0x00000073); // ecall

    // getchar
    writeROM32(0x0C,0x00300893); // a7=3
    writeROM32(0x10,0x00000073); // ecall

    // print char
    writeROM32(0x14,0x00100893);
    writeROM32(0x18,0x00000073);

    // jump back
    writeROM32(0x1C,0xFE1FF06F);
    ctx.fillText("C:>█",100,100);
    ctx.fill();

}

window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "s") {
    e.preventDefault();
    if (openedFilePath) {
        bus.saveRAMBufferToFile(openedFilePath, editorBufferAddr);
        alert("File saved.");
    }
    return;
    }
    if (e.ctrlKey && e.key === "l") {
    e.preventDefault();
    if (openedFilePath) {
        bus.loadFilesFromLocalStorage();
        alert("File loaded");
    }
    return;
    }
    if (!openedFilePath) return;

    let addr = editorBufferAddr;
    let byte;

    // find end of string
    while ((byte = bus.read8(addr)) !== 0) {
        addr++;
    }

    if (e.key.length === 1) {
        bus.write8(addr, e.key.charCodeAt(0));
        bus.write8(addr + 1, 0);
    }

    if (e.key === "Backspace") {
        if (addr > editorBufferAddr) {
            bus.write8(addr - 1, 0);
        }
    }

    if (e.key === "Enter") {
        escPressed=true;
        bus.write8(addr, 10);
        bus.write8(addr + 1, 0);
    }

    renderEditor();
});
