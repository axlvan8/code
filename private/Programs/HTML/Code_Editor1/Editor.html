<!DOCTYPE html>
<html lang="en" translate="yes">
    <head>
        <title>Code Editor</title>
        
        <style>
            *{
                box-sizing: border-box;
            }
            body{
                margin: 0;
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                background-color: #333;
                color: #f0f0f0;
            }
            #projectlist{
                list-style: none;
                padding: 0;
                color: #d1e0ff;
                text-decoration-color: #d1e0ff;
                text-decoration: solid;
               
            }
            #projectlist li{
                padding: 0.5em;
                cursor: pointer;
                border-bottom: 1px solid #ccc;
                background-color: #333;
            }

            #projectlist li:hover{
                background-color: #d1e0ff;
                 -webkit-text-fill-color: #d1e0ff;
            }
            input[type="text"]{
                width: 100%;
                padding: 9px;
                margin-bottom: 10px;
            }
            header{
                padding: 1em;
                background-color: #155de9;
                color: bisque;
                text-align: center;
                font-size: 1.5em;
            }
            #editor{
                position: absolute;
                bottom: -1em;
                padding: 0px;
                width: 100%;
                height: 300px;
                outline: none;
            }
            .buttons{
                display: flex;
                gap: 1em;
                margin-bottom: 1em;
            }
            .button{
                     
                background-color: #155de9;
                color:bisque;

                border: none;
                padding: 10px 20px;
                text-align: center;
                font-family: 'Arial';
            }
            .button:hover{
                opacity: 0.9;
            }
            textarea{
                flex: 1;      width: 100%;
                font-family: monospace;
                font-size: 14px;      
                padding: 10px;      
                margin-bottom: 1em;
            }
            .default{
                line-height: normal;
                padding: 4px;
                height: 100%;
                width: 100%;
            }
        </style>
        
    </head>
    <body>
        <div id="menu" style="display:block">
            <button id="MenuDefaultOption" onclick="loadDefault()">Default</button>
            <button id="MenuBeginnerOption" onclick="loadDefault()">Default</button>
        
        </div>
        <div id="Editor" style="display:none">
        <ul id="projectlist"></ul>
        
        <input type="text" id="pn" placeholder="Project Name">
        <br><br><br>
        <div id="editor">

        </div><br>
        <div class="buttons">
        <button onclick="a()" id="run" class="button">Run</button>
        <button onclick="save()" id="save" class="button">Save</button>
        </div>
        <pre id="output"></pre>
        <textarea id="tc" rows="20" cols="50">javascript


        </textarea>
        
        <p id="result"></p>
        <iframe id="sandbox" sandbox="allow-scripts allow-modals" width="800" height="800"></iframe>
        <div class="default"></div>
        </div>

        <!--<script src="JS/Menu.js"></script>-->
        
        <script src="JS/EditorMain.js"></script>
    </body>
</html>
