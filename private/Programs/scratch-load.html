<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scratch Runner (Fixed)</title>
</head>
<body>

<input id="pid" placeholder="Project ID">
<button onclick="run()">Run</button>

<canvas id="c" width="480" height="360"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- ONE bundle instead of 4 broken ones -->
<script src="https://extensions.turbowarp.org/scratch-vm.min.js"></script>

<script>
let vm;

async function init() {
  const canvas = document.getElementById("c");

  const renderer = new ScratchRender(canvas);
  const audioEngine = new window.AudioContext ? new ScratchAudio.Engine() : null;
  const storage = new ScratchStorage();

  vm = new ScratchVM();

  vm.attachRenderer(renderer);
  if (audioEngine) vm.attachAudioEngine(audioEngine);
  vm.attachStorage(storage);

  vm.start();
}

async function run() {
  if (!vm) await init();

  const id = document.getElementById("pid").value;

  const res = await fetch(`https://projects.scratch.mit.edu/${id}.sb3`);
  const buf = await res.arrayBuffer();

  const zip = await JSZip.loadAsync(buf);
  const json = JSON.parse(await zip.file("project.json").async("string"));

  await vm.loadProject(json);
  vm.greenFlag();
}
</script>

</body>
</html>
